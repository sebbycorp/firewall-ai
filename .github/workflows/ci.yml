name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r controller/requirements-dev.txt
      - name: Unit tests
        run: pytest
      - name: Validate student agent compose
        run: docker compose -f agent/docker-compose.yml config
      - name: Validate local controller compose
        run: docker compose -f compose.yaml config
